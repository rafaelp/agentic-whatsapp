name: Feature request
description: Suggest an improvement to agentic-whatsapp
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
